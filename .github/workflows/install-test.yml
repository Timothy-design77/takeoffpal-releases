name: Install test
# INSTALL-TEST.md on fresh GitHub-hosted Windows, Linux and Mac users: each installer from the public link (or, to try
# a release before it is approved, from that release by its tag). TakeoffPal is locked until the TAKEOFFPAL_BETA_KEY
# secret is entered: expect open proves that key opens it; expect locked proves that key is refused and the gate holds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test instead of the public link (blank = the public link; a draft is allowed)
        required: false
        default: ''
      expect:
        description: open = the key opens TakeoffPal; locked = the key is refused and the app stays locked
        type: choice
        options: [open, locked]
        default: open

permissions:
  contents: write  # Only to read a draft release when a tag is given.

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, installer: TakeoffPal-Setup.exe}
          - {os: ubuntu-latest, installer: TakeoffPal-Linux-x86_64.AppImage}
          - {os: macos-15, installer: TakeoffPal-Mac-arm64.dmg}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      INSTALLER: ${{ matrix.installer }}
      TAKEOFFPAL_EXPECT: ${{ inputs.expect }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.19.0'
      - name: Download the installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$INSTALLER" -D "$RUNNER_TEMP/in"
          else
            curl -fsSL -o "$RUNNER_TEMP/in/$INSTALLER" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$INSTALLER"
          fi
          echo "From: ${TAG:-the public link}"
      - name: Install, enter the key, save a job, uninstall, reinstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAKEOFFPAL_BETA_KEY: ${{ secrets.TAKEOFFPAL_BETA_KEY }}
        run: ./.github/install-test.ps1 -Setup "$env:RUNNER_TEMP\in\TakeoffPal-Setup.exe"
      - name: Install, enter the key, open, save and reopen
        if: runner.os != 'Windows'
        env:
          TAKEOFFPAL_BETA_KEY: ${{ secrets.TAKEOFFPAL_BETA_KEY }}
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" \
            node .github/check_unix_beta.mjs --artifact "$RUNNER_TEMP/in/$INSTALLER" --output "$RUNNER_TEMP/proof"
      - name: Capture the Mac app window
        # A picture for the --app= check above, taken even if that check failed. Only the app window processes this
        # launch starts are ended: ones already running are snapshotted first and left alone.
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          app="$RUNNER_TEMP/native/TakeoffPal.app" mount="$RUNNER_TEMP/native/mounted" proof="$RUNNER_TEMP/proof"
          windows='(Google Chrome|Microsoft Edge)\.app/Contents/MacOS/.*--app=http://127\.0\.0\.1'
          mkdir -p "$mount" "$proof"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/in/$INSTALLER"
          ditto "$mount/TakeoffPal.app" "$app"
          hdiutil detach "$mount"
          # pgrep exits 1 when nothing matches (fine under -e -o pipefail); 2 or more is a real error and still fails.
          app_windows() { pgrep -f "$windows" || [ $? -eq 1 ]; }
          before=" $(app_windows | tr '\n' ' ') "
          # The runner's own HOME, so the browser finds a login keychain and shows no keychain prompt over the window.
          env -u BROWSER "$app/Contents/MacOS/TakeoffPal" > "$RUNNER_TEMP/native/launch.log" 2>&1 &
          pid=$!
          started() { for window in $(app_windows); do [[ "$before" == *" $window "* ]] || echo "$window"; done; }
          cleanup() {
            kill "$pid" 2>/dev/null || true
            for window in $(started); do kill "$window" 2>/dev/null || true; done
            sed -E "s/([#?&]session=)[^[:space:]\"'&]+/\1[redacted]/g" "$RUNNER_TEMP/native/launch.log" > "$proof/native-launch.log"
          }
          trap cleanup EXIT
          sleep 30
          echo "New --app=http://127.0.0.1 window processes from this launch: $(started | wc -l | tr -d ' ')"
          screencapture -x "$proof/native-window.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/proof/*.png
            ${{ runner.temp }}/proof/*.log
            ${{ runner.temp }}/proof/*.json
            ${{ runner.temp }}/proof/*.txt
            ${{ runner.temp }}/proof/logs/
          retention-days: 7
