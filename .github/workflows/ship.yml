name: Ship
# The only way a build becomes the download (Latest). Each installer in the draft release must pass Estimator's
# ship/release_gate.py on its own system: no readable app source, every app .pyc its commit's source compiled, no private
# data or secrets, and a commit on combo/v5.2.0, which merges only after CI. Each must then install, open with the
# built-in library, save a job and reopen it. Only then does this push the release tag (a tag ruleset lets only the ship
# environment's deploy key create tags) and publish the draft as Latest (published releases are immutable).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to check and publish (v<version>-<commit8>)
        required: true

permissions:
  contents: read

concurrency: ship

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, installer: TakeoffPal-Setup.exe}
          - {os: ubuntu-latest, installer: TakeoffPal-Linux-x86_64.AppImage}
          - {os: macos-15, installer: TakeoffPal-Mac-arm64.dmg}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    environment: ship
    permissions:
      contents: write  # Only to read the draft release.
    env:
      INSTALLER: ${{ matrix.installer }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Python 3.12.14, the build the installers ship
        run: |
          uv python install 3.12.14
          echo "PYTHON=$(uv python find 3.12.14)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.19.0'
      - name: Download the installer from the draft
        run: |
          test "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$INSTALLER" -p "$INSTALLER.sha256" -D "$RUNNER_TEMP/in"
          cd "$RUNNER_TEMP/in"
          "$PYTHON" -c "import hashlib, sys; assert hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest() == open(sys.argv[1] + '.sha256').read().split()[0], 'differs from its .sha256'" "$INSTALLER"
      - name: Estimator at combo/v5.2.0
        env:
          DEPLOY_KEY: ${{ secrets.ESTIMATOR_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/estimator-key" && chmod 600 "$RUNNER_TEMP/estimator-key"
          GIT_SSH_COMMAND="ssh -i '$RUNNER_TEMP/estimator-key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --branch combo/v5.2.0 git@github.com:Timothy-design77/Estimator.git "$RUNNER_TEMP/estimator"
          rm "$RUNNER_TEMP/estimator-key"
      - name: Release gate
        run: |
          chmod +x "$RUNNER_TEMP/in/$INSTALLER"
          "$PYTHON" -I "$RUNNER_TEMP/estimator/ship/release_gate.py" "$RUNNER_TEMP/in/$INSTALLER" "$RUNNER_TEMP/gate" --7z 7z \
            --merged-into origin/combo/v5.2.0
      - name: Install, open, save and reopen
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAKEOFFPAL_BETA_KEY: ${{ secrets.TAKEOFFPAL_BETA_KEY }}
          TAKEOFFPAL_EXPECT: open
        run: ./.github/install-test.ps1 -Setup "$env:RUNNER_TEMP\in\TakeoffPal-Setup.exe"
      - name: Install, open, save and reopen
        if: runner.os != 'Windows'
        env:
          TAKEOFFPAL_BETA_KEY: ${{ secrets.TAKEOFFPAL_BETA_KEY }}
          TAKEOFFPAL_EXPECT: open
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" \
            node .github/check_unix_beta.mjs --artifact "$RUNNER_TEMP/in/$INSTALLER" --output "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/proof/*.png
            ${{ runner.temp }}/proof/*.log
            ${{ runner.temp }}/proof/*.json
            ${{ runner.temp }}/proof/*.txt
            ${{ runner.temp }}/proof/logs/
          retention-days: 7

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ship
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Push the release tag and publish the draft as Latest
        env:
          DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: |
          assets="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'select(.isDraft) | [.assets[].name] | sort | join(" ")')"
          expected="TakeoffPal-Linux-x86_64.AppImage TakeoffPal-Linux-x86_64.AppImage.sha256 TakeoffPal-Mac-arm64.dmg TakeoffPal-Mac-arm64.dmg.sha256 TakeoffPal-Setup.exe TakeoffPal-Setup.exe.sha256 latest.json latest.json.sig"
          [ "$assets" = "$expected" ] || { echo "::error::The draft must hold exactly the three installers, their .sha256 files and latest.json(.sig), not: $assets"; exit 1; }
          # The update note installed builds read must name this release's Windows installer (the app checks the signature).
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -p TakeoffPal-Setup.exe.sha256 -D "$RUNNER_TEMP/note"
          python3 -I - "$RUNNER_TEMP/note" "$GITHUB_REPOSITORY" "$TAG" <<'EOF'
          import json, sys
          d, repo, tag = sys.argv[1:]
          w = json.load(open(f"{d}/latest.json"))["windows"]
          url = f"https://github.com/{repo}/releases/download/{tag}/TakeoffPal-Setup.exe"
          assert w["url"].lower() == url.lower(), f"latest.json windows url {w['url']!r} is not {url}"
          sha = open(f"{d}/TakeoffPal-Setup.exe.sha256").read().split()[0]
          assert w["sha256"].lower() == sha.lower(), f"latest.json windows sha256 {w['sha256']!r} is not {sha}"
          EOF
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/releases-key" && chmod 600 "$RUNNER_TEMP/releases-key"
          GIT_SSH_COMMAND="ssh -i '$RUNNER_TEMP/releases-key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -q "git@github.com:$GITHUB_REPOSITORY.git" "HEAD:refs/tags/$TAG"
          rm "$RUNNER_TEMP/releases-key"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
